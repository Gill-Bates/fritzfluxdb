# =============================================================================
# fritzFlux - Setup & Deployment
# =============================================================================


# --- Local Development Setup ---
command -v python3.13 >/dev/null 2>&1 && PYTHON=python3.13 || PYTHON=python3
$PYTHON -m venv /opt/fritzfluxdb/.venv
source /opt/fritzfluxdb/.venv/bin/activate
pip install --upgrade pip
pip install -r /opt/fritzfluxdb/requirements.txt


# --- BUILD & RUN ---
./docker/build.sh
cd /opt/fritzfluxdb && source .venv/bin/activate && python run.py


# --- Create Changelog ---
Compare the commits since the last release tag (v1.5.0) with the current feature branch and create or update this repository's CHANGELOG.md in English. Use commit messages and the code diff to analyze the changes. Keep the changelog concise and include only what matters most to end users.
Separate the entries into "New", "Fix", and "Security". Always list "New" items first.
Check that both README files are up to date. Ensure that the content is in English.


# --- Squash Commit ---
Squash-merge all commits into main, create a new tag, tag it as v1.5.1, and push the tag. Use as commit Message "Release x.xx" Then delete the feature branch locally and remotely.

