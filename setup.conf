# =============================================================================
# fritzFlux - Setup & Deployment
# =============================================================================


# --- Local Development Setup ---
command -v python3.13 >/dev/null 2>&1 && PYTHON=python3.13 || PYTHON=python3
$PYTHON -m venv /opt/fritzfluxdb/.venv
source /opt/fritzfluxdb/.venv/bin/activate
pip install --upgrade pip
pip install /opt/fritzfluxdb


# --- BUILD & RUN ---
./docker/build.sh
cd /opt/fritzfluxdb && source .venv/bin/activate && python run.py


# --- Create Changelog ---
Vergleiche die Commits seit dem letzten Release-Tag (z. B. v1.6.0) mit dem aktuellen Feature-Branch und erstelle/aktualisiere die /opt/fritzfluxdb/CHANGELOG.md in englischer Sprache. Nutze dafür Commit-Messages und Code-Diff, um die Änderungen zu analysieren. Formuliere die Changelog kompakt und stichpunktartig - pro Punkt maximal 1-2 Sätze, nur das Wichtigste aus Sicht eines Endbenutzers.
Unterteile zwischen "New", "Fix" und "Security". "New" Punkte immer als Erstes auflisten. Fokussiere Dich ausschliesslich auf funktionale Änderungen; Design-Änderungen und rein interne Arbeit (Refactorings, Tests) werden weggelassen.

Prüfe, ob die Dokumentation, sowie die beiden README-Dateien den aktuellen Stand entsprechen. Achte darauf, dass die Inhalte in englischer Sprache vorliegen. Verwende die Dir vorliegenden Skills!

# --- Squash Commit ---
Squash-merge all commits into main, create a new tag, tag it as v1.6.1, and push the tag. Use as commit Message "Release x.xx" Then delete the feature branch locally and remotely.

# Prune
docker system prune -af
docker buildx prune -af

# --- Commit ---
Erstelle eine Commit Message auf Basis der Änderungen auf Englisch und comitte den aktuellen Stand in das Repo. Aber pushe nicht!
