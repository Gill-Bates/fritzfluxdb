# =============================================================================
# fritzfluxdb - Setup & Deployment
# =============================================================================

# --- Local Development Setup ---
command -v python3.14 >/dev/null 2>&1 && PYTHON=python3.14 || PYTHON=python3
$PYTHON -m venv /opt/fritzfluxdb/.venv
source /opt/fritzfluxdb/.venv/bin/activate
pip install --upgrade pip
.venv/bin/python -m pip install -e ".[dev]"


# --- Docker Login ---
docker login docker.cirrio.de

# --- Build & Push Image ---
# BUILD_INFO is written inside the image from the build args (see docker/Dockerfile).
PROJECT="fritzfluxdb" && \
REGISTRY="docker.cirrio.de" && \
cd "/opt/fritzfluxdb" && \
VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" && \
GIT_SHA="$(git rev-parse --verify HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
docker buildx build \
  --platform linux/amd64 \
  --pull \
  -f docker/Dockerfile \
  --build-arg "APP_VERSION=$VERSION" \
  --build-arg "VCS_REF=$GIT_SHA" \
  --build-arg "BUILD_DATE=$BUILD_DATE" \
  --label "org.opencontainers.image.version=$VERSION" \
  --label "org.opencontainers.image.revision=$GIT_SHA" \
  --label "org.opencontainers.image.created=$BUILD_DATE" \
  -t "${REGISTRY}/${PROJECT}:${VERSION}" \
  -t "${REGISTRY}/${PROJECT}:latest" \
  --push \
  .

# --- Create Changelog ---
Vergleiche die Commits seit dem letzten Release-Tag (z. B. v2.0.0) mit dem aktuellen Feature-Branch und erstelle/aktualisiere die /opt/fritzfluxdb/CHANGELOG.md in englischer Sprache. Nutze dafür Commit-Messages und Code-Diff, um die Änderungen zu analysieren. Formuliere die Changelog kompakt und stichpunktartig - pro Punkt maximal 1-2 Sätze, nur das Wichtigste aus Sicht eines Endbenutzers.
Unterteile zwischen "New", "Changed", "Fix" und "Security" (in dieser Reihenfolge). "New" Punkte immer als Erstes auflisten. "Changed" nimmt sichtbare Verhaltensänderungen bestehender Funktionen auf; sie gelangen über den Abschnitt der Version unverändert in die Release-Notes. Fokussiere Dich ausschliesslich auf funktionale Änderungen; Design-Änderungen und rein interne Arbeit (Refactorings, Tests) werden weggelassen.

Prüfe, ob die Dokumentation sowie die beiden README-Dateien den aktuellen Stand entsprechen. Achte darauf, dass die Inhalte in englischer Sprache vorliegen.

# --- Squash Commit ---
# Squash-merge all commits into main, create a new tag, tag it as v<version> (version from pyproject.toml), and push the tag. Use as commit Message "Release <version>" Then delete the feature branch locally and remotely.

VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
BRANCH="feature/v${VERSION}"

git checkout main && \
git merge --squash "$BRANCH" && \
git commit -m "Release $VERSION" && \
git tag "v$VERSION" && \
git push origin main && \
git push origin "v$VERSION" && \
git push origin --delete "$BRANCH" && \
git branch -D "$BRANCH"

# Published version tags are immutable. Correct release mistakes in a new version;
# never retag or force-push an existing release.

# --- Commit ---
# Erstelle eine Commit Message auf Basis der Änderungen auf Englisch und comitte den aktuellen Stand in das Repo. Aber pushe nicht!

# --- Rebase ---
# Wenn du mit Deiner Arbeit fertig bist:
# Arbeite auf dem aktuellen Branch `feature/v<version>`; kein Rebase-, Branch- oder Worktree-Wechsel ohne ausdrückliche Anweisung.

# --- Ruff & Pytest (same gates as CI) ---
cd /opt/fritzfluxdb && \
source .venv/bin/activate && \
ruff check . && \
pytest -q -p no:xdist
