# =============================================================================
# fritzFlux - Setup & Deployment
# =============================================================================


# --- Local Development Setup ---
command -v python3.13 >/dev/null 2>&1 && PYTHON=python3.13 || PYTHON=python3
$PYTHON -m venv /opt/fritzflux/.venv
source /opt/fritzflux/.venv/bin/activate
pip install --upgrade pip
pip install -r /opt/fritzflux/requirements.txt


# --- BUILD & RUN ---
./docker/build.sh

cd /opt/fritzflux && source .venv/bin/activate && python run.py

# Changelog
Vergleiche die Commits seit dem letzten Release-Tag (v1.2) mit dem aktuellen Feature Branch und erstelle/aktualisiere die Changelog in englischer Sprache. Nutze dafür u.a. Commit Messages und Code Diff, um die Änderungen zu analysieren. Formuliere die Changelog kompakt und nur das Wichtigste aus Sicht eines Endbenutzers.
Unterteile zwischen "New" und "Fix" sowie "Security". "New" Punkte immer als Erstes auflisten. Halte Dich kompakt.


# Squash Merge & Tag
Mache ein Squash Merge aller Commits nach main, erstelle einen neuen tag und tagge auf v1.3 und pushe den Tag. Danach löscht du den Feature-Branch lokal und remote.

# Pack Database
tar -czvf /root/questdb_data.tar.gz /opt/docker/questdb/data

# Prune
docker system prune -af
docker buildx prune -af
