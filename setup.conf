# =============================================================================
# fritzFlux - Setup & Deployment
# =============================================================================


# --- Local Development Setup ---
command -v python3.13 >/dev/null 2>&1 && PYTHON=python3.13 || PYTHON=python3
$PYTHON -m venv /opt/fritzflux/.venv
source /opt/fritzflux/.venv/bin/activate
pip install --upgrade pip
pip install -r /opt/fritzflux/requirements.txt


# --- BUILD & RUN ---
./docker/build.sh

cd /opt/fritzflux && source .venv/bin/activate && python run.py

# --- Create Changelog ---
Vergleiche die Commits seit dem letzten Release-Tag (z. B. v1.4) mit dem aktuellen Feature-Branch und erstelle/aktualisiere die /opt/fritzfluxdb/CHANGELOG.md in englischer Sprache. Nutze dafür Commit-Messages und Code-Diff, um die Änderungen zu analysieren. Formuliere die Changelog kompakt und stichpunktartig - pro Punkt maximal 1-2 Sätze, nur das Wichtigste aus Sicht eines Endbenutzers.
Unterteile zwischen "New", "Fix" und "Security". "New" Punkte immer als Erstes auflisten. Fokussiere Dich ausschliesslich auf funktionale Änderungen; Design-Änderungen und rein interne Arbeit (Refactorings, Tests) werden weggelassen.

Prüfe, ob die beiden README-Dateien den aktuellen Stand entsprechen. Achte darauf, dass die Inhalte in englischer Sprache vorliegen.

# --- Squash Commit ---
Führe die Änderungen des Feature-Branches per Squash-Merge in main zusammen und erstelle dafür einen neuen Commit. Erstelle auf diesem aktuellen main-Commit den Tag v1.5 und pushe main sowie den Tag. Sollte der neue Tag fehlen, erstelle ihn zuvor. Lösche anschließend den Feature-Branch lokal und remote. Achte darauf, dass in der Commit-Message "Release v1.5" steht (keine autogenerated Message).

# Pack Database
tar -czvf /root/questdb_data.tar.gz /opt/docker/questdb/data

# Prune
docker system prune -af
docker buildx prune -af
