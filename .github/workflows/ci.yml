#
# .github/workflows/ci.yml
# Purpose: PR and push gate (lint, tests, manifest invariants, Dockerfile and workflow
#   checks, source scan). docker-build.yml calls it as the release gate.
# Related: docker-build.yml (release), docs-build.yml (Pages), security.yml (image rescan).
#

name: Lint & Test
run-name: ci-${{ github.run_number }}

# One definition of the gate: runs on every branch push and pull request, and the
# release workflow calls it so a release is gated by exactly the same checks.
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    secrets:
      # Read access to the private Gill-Bates/python-libraries repository.
      RELEASE_TOKEN:
        required: true

permissions:
  contents: read

# Only a pull request run is cancellable: a push run is the gate result a release
# reads, so a newer push must not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Seconds-cheap checks that need no dependency install run beside the test job
  # and fail the run early; parallel on purpose, a PR gate has no irreversible step.
  manifest:
    name: pyproject.toml is the only manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # The helper lives in the repository, so the checkout has to come first. It prints
      # the agent banner and points TMPDIR, TMP and TEMP at the job temp directory.
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      # Reintroducing a manifest would give the release workflow, the running container
      # and the docs build two manifests to disagree about; the docs copies are
      # generated by docs-build.yml and committed copies would go stale.
      - name: Reject reintroduced manifests
        run: |
          set -euo pipefail
          failed=0
          # Any tracked path, not only the root, so a stray tools/requirements.txt fails too.
          while IFS= read -r stale; do
            echo "::error::$stale is obsolete; use pyproject.toml"
            failed=1
          done < <(git ls-files -- ':(glob)**/requirements*.txt' ':(glob)**/ruff.toml' ':(glob)**/VERSION')
          # The docs build copies CHANGELOG.md and LICENSE into docs/ at build time.
          for copy in docs/changelog.md docs/license.md; do
            if [ -e "$copy" ]; then
              echo "::error::$copy is a build-time copy of a root file and must not exist in the repository"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

      # The single place that defines a valid release version. A bad version has to
      # fail here, before the tag is pushed: a pushed tag is not retractable like a
      # commit.
      - name: Version is release-shaped and dependencies are pinned
        run: python3 tools/check_manifest.py
  workflows:
    name: Workflow lint (actionlint + shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # The helper lives in the repository, so the checkout has to come first. It prints
      # the agent banner and points TMPDIR, TMP and TEMP at the job temp directory.
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      # actionlint runs shellcheck over every inline `run:` block when the binary is
      # on PATH and silently skips it otherwise. Failing here keeps that half of the
      # gate from disappearing unnoticed with a runner image.
      - name: shellcheck is available
        run: command -v shellcheck && shellcheck --version

      # Exact release plus its published sha256 keeps workflow lint repeatable.
      - name: Install actionlint
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      # Reads .github/actionlint.yaml.
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

  zizmor:
    name: Workflow security lint (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # The helper lives in the repository, so the checkout has to come first. It prints
      # the agent banner and points TMPDIR, TMP and TEMP at the job temp directory.
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py
      # Exact PyPI release: zizmor complements actionlint with unpinned actions, template
      # injection and over-broad permissions. Reads .github/zizmor.yml.
      - name: Install zizmor
        env:
          ZIZMOR_VERSION: "1.32.0"
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --disable-pip-version-check "zizmor==${ZIZMOR_VERSION}"
      # The token only enables zizmor's online audits (known-vulnerable actions, impostor
      # commits); it is read-only.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --no-progress --format=github .github/workflows'
  container:
    name: Dockerfile + shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # The helper lives in the repository, so the checkout has to come first. It prints
      # the agent banner and points TMPDIR, TMP and TEMP at the job temp directory.
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      # The image is only built from a release tag, so without these steps a broken
      # entrypoint or Dockerfile stays invisible until the release itself. The full
      # multi-arch build is too slow for a PR; this is the cheap half that still
      # catches a typo. -n parses a script without executing it.
      - name: Shell script syntax
        run: |
          set -euo pipefail
          bash -n docker/entrypoint.sh

      - name: Shell script shellcheck
        run: shellcheck docker/entrypoint.sh

      # BuildKit checks stages and COPY targets without running the build.
      - name: Dockerfile check
        run: docker build --check -f docker/Dockerfile .

  # ruff and pytest are independent, so they run as parallel legs instead of one
  # sequential job. Each leg installs the same pinned environment.
  check:
    name: Check (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, pytest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      # The helper lives in the repository, so the checkout has to come first. It prints
      # the agent banner and points TMPDIR, TMP and TEMP at the job temp directory.
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          # Matches requires-python in pyproject.toml and the Python base of docker/Dockerfile.
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      # The requirement files are generated from pyproject.toml into the runner
      # temp directory; wheels only, so no dependency builds from source.
      # The gillbates-* packages are tags of the private python-libraries repository: they
      # install from git with the token handed over by a credential helper, so they are
      # split off the wheels-only install. The token is missing for fork pull requests.
      - name: Install dependencies
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          : "${RELEASE_TOKEN:?Missing RELEASE_TOKEN secret (not available to pull requests from forks)}"
          python tools/pyproject-deps.py dev > "$RUNNER_TEMP/requirements-ci.txt"
          python tools/pyproject-deps.py > "$RUNNER_TEMP/requirements-all.txt"
          grep -v '^gillbates-' "$RUNNER_TEMP/requirements-all.txt" >> "$RUNNER_TEMP/requirements-ci.txt"
          grep '^gillbates-' "$RUNNER_TEMP/requirements-all.txt" > "$RUNNER_TEMP/requirements-libs.txt"
          cat "$RUNNER_TEMP/requirements-ci.txt" "$RUNNER_TEMP/requirements-libs.txt"
          pip install --only-binary=:all: -r "$RUNNER_TEMP/requirements-ci.txt"
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=
          export GIT_CONFIG_KEY_1=credential.helper
          # shellcheck disable=SC2016 # expanded by git's helper shell at call time, not here
          export GIT_CONFIG_VALUE_1='!f() { echo username=x-access-token; echo "password=${RELEASE_TOKEN}"; }; f'
          pip install -r "$RUNNER_TEMP/requirements-libs.txt"
          pip check
          python -c "import gillbates_logging, gillbates_shutdown_handler"
      - name: Run ruff
        if: matrix.check == 'ruff'
        run: ruff check --output-format=github .
      # Mandatory: pytest exits non-zero when it collects no tests, so a
      # missing or emptied test suite fails the gate instead of passing it.
      # One process in random order (pytest-randomly), exactly as AGENTS.md runs it
      # locally: xdist would hide state leaks behind separate worker processes. The
      # seed is printed at the end of the run to reproduce a red result.
      - name: Run tests
        if: matrix.check == 'pytest'
        run: pytest -q -p no:xdist
  source-scan:
    name: Source secrets + misconfiguration
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # The helper lives in the repository, so the checkout has to come first. It prints
      # the agent banner and points TMPDIR, TMP and TEMP at the job temp directory.
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      # The release image scan owns vulnerabilities. This scans the source tree for
      # committed secrets and for Dockerfile and Compose misconfiguration. Trivy runs as
      # the CLI instead of the action, because the gate has to read the scanner log: the
      # action's output is not available to a later step.
      - name: Install Trivy
        # Pinned to an immutable commit SHA, see GHSA-69fq-xp46-6x23.
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.70.0
          cache: true

      # Exit 0 even with findings: the verdict comes from the report in the next step, and
      # a scanner error still fails this step. Excluded paths are tooling and build output
      # that never ship: .git, virtualenvs, bytecode, the built docs site and tool caches.
      - name: Trivy source scan
        run: |
          set -euo pipefail
          trivy fs --scanners secret,misconfig \
            --skip-dirs .git,.venv,venv,__pycache__,site,.pytest_cache,.ruff_cache \
            --severity CRITICAL,HIGH --ignorefile .trivyignore --timeout 5m \
            --skip-version-check --exit-code 0 \
            --format json --output "$RUNNER_TEMP/trivy-source.json" . \
            2>&1 | tee "$RUNNER_TEMP/trivy-source.log"

      # Fails on findings, on a report without a config result (misconfig did not run), on
      # a missing or empty scan input, and on the scanner log lines that mean a scan on
      # nothing or on embedded rules.
      - name: Evaluate source scan report
        run: |
          set -euo pipefail
          python3 tools/trivy_report.py status "$RUNNER_TEMP/trivy-source.json" \
            --expect-class config --expect-class secret --input . \
            --log-file "$RUNNER_TEMP/trivy-source.log" --fail-on-findings \
            --summary-title "Trivy (source)" --list 20 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-source-report
          path: ${{ runner.temp }}/trivy-source.json
          retention-days: 30
          if-no-files-found: warn
