name: Lint & Test

# One definition of the lint/test gate: runs on every branch push and pull
# request, and the release workflow calls it so a release is gated by exactly
# the same checks.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python tools/pyproject-deps.py dev > requirements-ci.txt
          python tools/pyproject-deps.py >> requirements-ci.txt
          cat requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Run ruff
        run: ruff check .

      # Mandatory: pytest exits non-zero when it collects no tests, so a
      # missing or emptied test suite fails the gate instead of passing it.
      - name: Run tests
        run: pytest -q

      - name: Check project metadata and dependency pins
        run: |
          set -euo pipefail
          for stale in requirements.txt docs/requirements-docs.txt ruff.toml; do
            if [ -e "$stale" ]; then
              echo "ERROR: $stale is obsolete; use pyproject.toml"
              exit 1
            fi
          done
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          version = project["project"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?", version):
              raise SystemExit(f"Invalid release version: {version}")
          for group, dependencies in project["project"]["optional-dependencies"].items():
              unpinned = [dependency for dependency in dependencies if "==" not in dependency]
              if unpinned:
                  raise SystemExit(f"Unpinned {group} dependencies: {unpinned}")
          print(f"Version {version}; all optional dependency groups are pinned.")
          PY
