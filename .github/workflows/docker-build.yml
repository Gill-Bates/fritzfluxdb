name: Build & Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to registry'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      platforms:
        description: 'Platforms to build (release tags and the GitHub Release need all of them)'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - 'linux/amd64'
          - 'linux/arm64'
          - 'linux/amd64,linux/arm64'
      enforce_trivy_gate:
        description: 'Fail an unpublished (push=false) run on HIGH/CRITICAL Trivy findings; publishing runs always enforce it'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REGISTRY: docker.io
  IMAGE_NAME: giiibates/fritzfluxdb

# One lock for everything that writes release tags. queue: max keeps every
# waiting run instead of letting a newer one replace an already pending one.
concurrency:
  group: docker-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  meta:
    name: Validate build metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
      version: ${{ steps.meta.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      publish: ${{ steps.plan.outputs.publish }}
      release: ${{ steps.plan.outputs.release }}
      enforce_trivy_gate: ${{ steps.plan.outputs.enforce_trivy_gate }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      # Every publish/release decision is made here, once; later jobs only
      # read these outputs.
      #   publish            - push the per-architecture image tags
      #   release            - publish + full platform matrix: move the shared
      #                        ${VERSION}/latest tags and the GitHub Release.
      #                        A single-arch run must not replace a multi-arch
      #                        index with a single-arch one.
      #   enforce_trivy_gate - always on when publishing
      #   matrix             - the requested platforms (a single-platform
      #                        dispatch filters it; job-level "if:" cannot see
      #                        the matrix context)
      - name: Resolve build plan
        id: plan
        env:
          PUSH_INPUT: ${{ inputs.push }}
          PLATFORMS_INPUT: ${{ inputs.platforms }}
          GATE_INPUT: ${{ inputs.enforce_trivy_gate }}
        run: |
          set -euo pipefail
          all_platforms='[
            {"arch": "amd64", "runner": "ubuntu-24.04", "platform": "linux/amd64"},
            {"arch": "arm64", "runner": "ubuntu-24.04-arm", "platform": "linux/arm64"}
          ]'

          include="$(jq -c --arg requested "${PLATFORMS_INPUT:-}" '
            ($requested | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))) as $r
            | if ($r | length) == 0 then . else map(select(.platform as $p | $r | index($p))) end
          ' <<<"$all_platforms")"

          selected="$(jq 'length' <<<"$include")"
          total="$(jq 'length' <<<"$all_platforms")"
          if (( selected == 0 )); then
            echo "ERROR: no known platform selected: '${PLATFORMS_INPUT}'"
            exit 1
          fi

          # Tag pushes carry no inputs: they publish and release.
          publish=true
          [[ "${PUSH_INPUT:-}" == "false" ]] && publish=false
          release=false
          [[ "$publish" == true ]] && (( selected == total )) && release=true
          enforce_trivy_gate="$publish"
          [[ "${GATE_INPUT:-}" == "true" ]] && enforce_trivy_gate=true

          {
            echo "matrix=$(jq -c '{include: .}' <<<"$include")"
            echo "publish=${publish}"
            echo "release=${release}"
            echo "enforce_trivy_gate=${enforce_trivy_gate}"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Validate registry secrets
        if: steps.plan.outputs.publish == 'true'
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${REGISTRY_USERNAME:?Missing DOCKERHUB_USERNAME secret}"
          : "${REGISTRY_PASSWORD:?Missing DOCKERHUB_TOKEN secret}"

      - name: Validate and set build metadata
        id: meta
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
        run: |
          set -euo pipefail

          if [ ! -f VERSION ]; then
            echo "ERROR: VERSION file not found"
            exit 1
          fi

          VERSION="$(tr -d '[:space:]' < VERSION)"

          bash docker/validate-version.sh "$VERSION"

          # A tag push must always match the VERSION file - otherwise a release
          # would publish a version tag that reads differently inside the image
          # than on the outside.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "ERROR: Git tag (v${TAG_VERSION}) does not match VERSION file (${VERSION})"
              exit 1
            fi
          fi

          # The release names the tag v${VERSION}; if that tag already exists
          # it must point at the commit being built, or the GitHub Release
          # would describe different code than the image. Checked before
          # anything is published. A missing tag is created by the release
          # job at this commit.
          if [[ "$RELEASE" == "true" ]]; then
            RELEASE_TAG="v${VERSION}"
            BUILD_COMMIT="$(git rev-parse HEAD)"
            TAG_COMMIT="$(git ls-remote --tags origin | awk -v tag="refs/tags/${RELEASE_TAG}" '
              $2 == tag "^{}" { peeled = $1 }
              $2 == tag       { direct = $1 }
              END { print (peeled != "" ? peeled : direct) }')"
            if [[ -n "$TAG_COMMIT" && "$TAG_COMMIT" != "$BUILD_COMMIT" ]]; then
              echo "ERROR: tag ${RELEASE_TAG} points at ${TAG_COMMIT}, but this run builds ${BUILD_COMMIT}"
              echo "       Bump VERSION or dispatch the run on ${RELEASE_TAG}."
              exit 1
            fi
          fi

          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}, Build date: ${BUILD_DATE}"

  lint-test:
    name: Lint & Test
    needs: meta
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.arch }} image
    # No image is built from code that failed lint or tests.
    needs: [meta, lint-test]
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.meta.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Generate BUILD_INFO
        run: |
          set -euo pipefail
          cat > BUILD_INFO <<EOF
          APP_VERSION=${VERSION}
          GIT_SHA=${{ github.sha }}
          BUILD_DATE=${{ needs.meta.outputs.build_date }}
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # build-push-action provides the runtime token the type=gha cache needs;
      # a plain `docker buildx build` in a run step silently gets no cache.
      # context: . (not the default git context) so the generated BUILD_INFO
      # is part of the build.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          load: true
          push: false
          cache-from: type=gha,scope=fritzfluxdb-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fritzfluxdb-${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.meta.outputs.build_date }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ matrix.arch }}

      - name: Smoke test image
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_BUILD_DATE: ${{ needs.meta.outputs.build_date }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}:${VERSION}-${{ matrix.arch }}"

          echo "=== CLI help via the normal start path (tini -> watchdog) ==="
          docker run --rm "${IMAGE}" python run.py --help
          echo "✓ CLI responds"

          echo "=== Runtime user via the normal start path ==="
          uid="$(docker run --rm "${IMAGE}" python -c 'import os; print(f"UID={os.getuid()}")' \
            | sed -n 's/^UID=//p')"
          if [[ "$uid" != "10001" ]]; then
            echo "✗ daemon command runs as uid '${uid}', expected 10001 (fritzfluxdb)"
            exit 1
          fi
          echo "✓ daemon command runs as uid ${uid}"

          echo "=== Build metadata ==="
          docker run --rm --entrypoint python \
            -e EXPECTED_VERSION="${VERSION}" \
            -e EXPECTED_SHA \
            -e EXPECTED_BUILD_DATE \
            "${IMAGE}" -c '
          import os
          import sys

          import fritzfluxdb.main  # noqa: F401 - import must succeed
          import fritzfluxdb.version as v

          expected = {
              "VERSION": os.environ["EXPECTED_VERSION"],
              "GIT_SHA": os.environ["EXPECTED_SHA"],
              "BUILD_DATE": os.environ["EXPECTED_BUILD_DATE"],
          }
          failures = [
              f"{name} is {getattr(v, name)!r}, expected {value!r}"
              for name, value in expected.items()
              if getattr(v, name) != value
          ]
          if failures:
              for failure in failures:
                  print(f"✗ {failure}", file=sys.stderr)
              sys.exit(1)
          print(f"✓ Version {v.VERSION} ({v.GIT_SHA[:12]}), built {v.BUILD_DATE}")
          '

          echo "=== Filesystem validation ==="
          docker run --rm --entrypoint /bin/sh "${IMAGE}" -c '
            test -x /usr/local/bin/entrypoint.sh && echo "/usr/local/bin/entrypoint.sh: OK" || exit 1
            test -x /usr/bin/tini && echo "/usr/bin/tini: OK" || exit 1
            for tool in pip pip3; do
              if command -v "$tool" >/dev/null; then echo "$tool present in runtime image"; exit 1; fi
            done
            python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec(\"pip\") is not None)" \
              || { echo "pip module importable in runtime image"; exit 1; }
            echo "pip absent from runtime image (executables and module): OK"
          '
          echo "✓ All smoke tests passed for ${IMAGE}"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ matrix.arch }}'
          format: 'json'
          output: 'trivy-${{ matrix.arch }}.json'
          exit-code: ${{ needs.meta.outputs.enforce_trivy_gate == 'true' && '1' || '0' }}
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '10m'
          trivyignores: '.trivyignore'

      # The single evaluation of the report: writes the step summary and a
      # one-line verdict that the release notes reuse verbatim. An unreadable
      # report fails the step instead of passing as "0 findings".
      - name: Evaluate Trivy report
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          report="trivy-${ARCH}.json"
          status_file="trivy-${ARCH}.status"

          if ! counts="$(jq -er '
                if (.SchemaVersion | type) != "number" then error("not a Trivy report") else . end
                | [.Results[]?.Vulnerabilities[]?.Severity] as $s
                | "\($s | map(select(. == "CRITICAL")) | length) \($s | map(select(. == "HIGH")) | length)"
              ' "$report" 2>/dev/null)"; then
            verdict="❌ Scan evaluation failed: report missing or unreadable"
            echo "$verdict" | tee "$status_file"
            printf '### Trivy (%s)\n%s\n' "$ARCH" "$verdict" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          read -r critical high <<<"$counts"
          if (( critical + high > 0 )); then
            verdict="⚠️ ${critical} CRITICAL, ${high} HIGH with a fix available"
          else
            verdict="✅ No HIGH/CRITICAL findings with a fix available"
          fi
          echo "$verdict" > "$status_file"

          {
            echo "### Trivy (${ARCH})"
            echo "$verdict"
            echo
            echo "_Scope: HIGH/CRITICAL with a fix available; unfixed CVEs and \`.trivyignore\` entries are excluded._"
            if (( critical + high > 0 )); then
              echo '```'
              jq -r '.Results[]?.Vulnerabilities[]? | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)"' "$report" | head -20
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-findings-${{ matrix.arch }}
          path: |
            trivy-${{ matrix.arch }}.json
            trivy-${{ matrix.arch }}.status
          retention-days: 14
          if-no-files-found: warn

      # Credentials enter the job only after the image passed smoke test and scan.
      - name: Log in to registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: env.PUBLISH == 'true'
        run: docker push "${IMAGE_NAME}:${VERSION}-${{ matrix.arch }}"

      # The arch tag is mutable in the registry - any later push can move it.
      # The digest resolved right after this push names exactly the image
      # that passed the checks above, so the manifest job builds the index
      # from digests, never from tags.
      - name: Record image digest
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          mkdir -p digests
          digest="$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:${VERSION}-${{ matrix.arch }}" \
            --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: unexpected digest: '${digest}'"
            exit 1
          fi
          printf '%s' "$digest" > "digests/${{ matrix.arch }}"
          echo "${{ matrix.arch }} -> ${digest}"

      - name: Upload image digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  create-manifest:
    name: Create multi-arch manifest
    needs: [meta, build]
    # needs.build.result is only 'success' if every matrix leg succeeded, and
    # release is only true for the full platform matrix - a failed leg or a
    # single-arch dispatch never moves the shared tags.
    if: needs.build.result == 'success' && needs.meta.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      MATRIX: ${{ needs.meta.outputs.matrix }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: image-digest-*
          path: digests/
          merge-multiple: true

      # The index is assembled with --dry-run and checked before any public
      # tag changes. The expected platforms come from the build matrix, not
      # from the downloaded files, so a missing architecture cannot shrink
      # the expectation along with the index.
      - name: Assemble and verify index
        run: |
          set -euo pipefail
          jq -r '.include[].platform' <<<"$MATRIX" | sort > expected-platforms.txt

          sources=()
          for arch in $(jq -r '.include[].arch' <<<"$MATRIX"); do
            file="digests/${arch}"
            if [[ ! -s "$file" ]]; then
              echo "ERROR: no image digest for linux/${arch}"
              exit 1
            fi
            digest="$(< "$file")"
            sources+=("${IMAGE_NAME}@${digest}")
            echo "  linux/${arch}  ${digest}"
          done
          printf '%s\n' "${sources[@]}" > sources.txt

          docker buildx imagetools create --dry-run "${sources[@]}" > index.json

          jq -r '[.manifests[]? | select(.platform.architecture != "unknown")
                  | "\(.platform.os)/\(.platform.architecture)"] | sort[]' index.json \
            > actual-platforms.txt
          if ! diff -u expected-platforms.txt actual-platforms.txt; then
            echo "ERROR: assembled index does not describe the build matrix"
            exit 1
          fi
          echo "OK: index describes $(paste -sd' ' actual-platforms.txt)"

      - name: Publish release tags
        run: |
          set -euo pipefail
          mapfile -t sources < sources.txt

          docker buildx imagetools create --tag "${IMAGE_NAME}:${VERSION}" "${sources[@]}"

          # The published index must be the one verified above.
          docker buildx imagetools inspect --raw "${IMAGE_NAME}:${VERSION}" | jq -S . > published.json
          if ! diff -u <(jq -S . index.json) published.json; then
            echo "ERROR: ${IMAGE_NAME}:${VERSION} differs from the verified index"
            exit 1
          fi
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" --format '{{.Manifest.Digest}}')"
          echo "Pushed ${IMAGE_NAME}:${VERSION} -> ${digest}"

          # Latest is greatest: every stable (non-prerelease) run moves
          # 'latest' unconditionally, no comparison against already published
          # versions. It is copied from the verified digest, not rebuilt.
          if [[ "$VERSION" == *-* ]]; then
            echo "Skipping 'latest': ${VERSION} is a prerelease"
          else
            docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}@${digest}"
            latest="$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" --format '{{.Manifest.Digest}}')"
            if [[ "$latest" != "$digest" ]]; then
              echo "ERROR: ${IMAGE_NAME}:latest resolves to ${latest}, expected ${digest}"
              exit 1
            fi
            echo "Pushed ${IMAGE_NAME}:latest -> ${digest}"
          fi

  create-release:
    name: Create GitHub Release
    needs: [meta, create-manifest]
    if: needs.create-manifest.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      ARCHES: ${{ join(fromJson(needs.meta.outputs.matrix).include.*.arch, ' ') }}
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Download Trivy findings
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: trivy-findings-*
          path: trivy-reports/
          merge-multiple: false

      - name: Create or update GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const createRelease = require('./.github/scripts/create-release.js');
            await createRelease({ github, context });
