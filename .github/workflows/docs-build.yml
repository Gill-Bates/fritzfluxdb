#
# .github/workflows/docs-build.yml
# Purpose: build the MkDocs site, scan its pinned dependencies, deploy to GitHub Pages.
# Related: ci.yml (PR gate), docker-build.yml (release; a successful release rebuilds the site).
#

name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/workflows/docs-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:
  # A release can ship a changelog bump that never touches docs/** on its own, and a
  # re-run of the release from an existing tag would not fire this workflow at all.
  # Rebuilding after a successful release keeps the deployed site in step with what
  # was actually published.
  workflow_run:
    workflows:
      - 'Build & Push Docker Image'
    types:
      - completed
  schedule:
    # Weekly re-scan: a new CVE in the docs dependencies would otherwise only surface
    # when something in the repository happens to change.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # workflow_run fires on every conclusion of the release workflow (success, failure,
    # cancelled). Only a successful release should rebuild the docs; no other trigger
    # has a conclusion to check.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # git-revision-date-localized needs the full history
          persist-credentials: false
          # On workflow_run, GITHUB_SHA is the default branch's head rather than the
          # commit the release published, so main moving on in the meantime would
          # deploy documentation for changes outside the release. Empty for every
          # other trigger, which leaves checkout's own default in place.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      # The docs toolchain is pinned in docs/requirements-docs.txt and is deliberately
      # separate from the runtime dependencies in pyproject.toml: building the site
      # never needs the daemon or its libraries installed.
      - name: Install documentation toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r docs/requirements-docs.txt

      # mkdocs.yml's nav references both files; they live at the repository root and
      # are mirrored into docs/ for the build.
      - name: Copy root files into the docs tree
        run: |
          set -euo pipefail
          cp CHANGELOG.md docs/changelog.md
          cp LICENSE docs/license.md

      - name: Build documentation
        run: |
          set -euo pipefail
          mkdocs build -f docs/mkdocs.yml --strict

      # Runs against the same build that gets deployed. img.shields.io is excluded
      # because the README and landing-page badges are rendered on demand by a third
      # party that throttles: a badge answering 503 says nothing about the docs and
      # would only produce reruns.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --exclude 'fonts\.gstatic\.com'
            --exclude 'img\.shields\.io'
            './site/**/*.html'
          fail: true

      - name: Upload artifact
        if: |
          github.ref == 'refs/heads/main' &&
          (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'workflow_run'
          )
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  security-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The same commit the build job resolves, or the scan reports against a
          # different dependency set than the one being deployed.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      # Trivy reports on what a manifest names, and requirements-docs.txt names its
      # five direct dependencies only: mkdocs-material alone pulls in jinja2,
      # markupsafe, babel, requests, urllib3 and pygments. Installing the toolchain
      # and freezing the result gives the scanner the environment mkdocs actually
      # builds in, transitive set included. The frozen file is a scan inventory, not
      # an installation pin.
      - name: Materialise the docs environment for scanning
        run: |
          set -euo pipefail
          python -m venv .docs-scan
          .docs-scan/bin/python -m pip install --quiet --upgrade pip
          .docs-scan/bin/python -m pip install --quiet -r docs/requirements-docs.txt
          # The name has to contain "requirement" or Trivy's pip analyzer skips the file.
          .docs-scan/bin/python -m pip freeze --all > docs-requirements-frozen.txt
          echo "Scanning $(grep -c '==' docs-requirements-frozen.txt) resolved packages:"
          cat docs-requirements-frozen.txt

      - name: Trivy scan docs dependencies
        # Pinned to an immutable commit SHA, and to the scanner version this revision
        # installs - see GHSA-69fq-xp46-6x23.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          # The frozen environment, not the manifest: see the step above.
          scan-ref: 'docs-requirements-frozen.txt'
          # Dependency vulnerabilities only; secret and misconfig scanning of the
          # sources belongs to ci.yml.
          scanners: 'vuln'
          trivyignores: .trivyignore
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          timeout: '5m'

  deploy:
    if: |
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_run'
      )
    needs:
      - build
      - security-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
