#
# .github/workflows/docs-build.yml
# Purpose: build the MkDocs site, scan its pinned dependencies, deploy to GitHub Pages.
#   A failed weekly scheduled run opens or updates one tracking issue.
# Related: ci.yml (PR gate), docker-build.yml (release; a successful release rebuilds the site).
#

name: Deploy Documentation
run-name: docs-build-${{ github.run_number }}

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'pyproject.toml'
      - 'tools/pyproject-deps.py'
      - '.github/workflows/docs-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'pyproject.toml'
      - 'tools/pyproject-deps.py'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:
  # A release can ship a changelog bump that never touches docs/** on its own, and a
  # re-run of the release from an existing tag would not fire this workflow at all.
  # Rebuilding after a successful release keeps the deployed site in step with what
  # was actually published.
  workflow_run:
    workflows:
      - 'Build & Push Docker Image'
    types:
      - completed
  schedule:
    # Weekly re-scan: a new CVE in the docs dependencies would otherwise only surface
    # when something in the repository happens to change.
    - cron: '17 4 * * 1'

permissions:
  contents: read

# The weekly scan runs on the default branch like a deployment does, so it gets its
# own group: sharing one would let a starting scan cancel a running deploy. Only PR
# runs are cancellable; a deploy already underway is left to finish.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scan' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # workflow_run fires on every conclusion of the release workflow, including manual
    # test dispatches (push=false, one architecture). Only a successful tag push (v*)
    # always publishes, so only that rebuilds the docs; other triggers are unaffected.
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # git-revision-date-localized needs the full history
          persist-credentials: false
          # No explicit ref: on workflow_run the default checkout is the head of the
          # default branch, which is what must be deployed. The release's own head_sha
          # would let a re-run of an older tag publish stale docs over a newer site.
      # The helper lives in the repository, so the checkout has to come first. It prints
      # the agent banner and points TMPDIR, TMP and TEMP at the job temp directory.
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The docs toolchain is declared in pyproject.toml. Materialise only that
      # group so the documentation build does not install app dependencies.
      - name: Install documentation toolchain
        run: |
          set -euo pipefail
          python tools/pyproject-deps.py docs > "$RUNNER_TEMP/requirements-docs.txt"
          cat "$RUNNER_TEMP/requirements-docs.txt"
          pip install -r "$RUNNER_TEMP/requirements-docs.txt"

      # mkdocs.yml's nav references both files; they live at the repository root and
      # are mirrored into docs/ for the build.
      - name: Copy root files into the docs tree
        run: |
          set -euo pipefail
          cp CHANGELOG.md docs/changelog.md
          cp LICENSE docs/license.md

      - name: Build documentation
        run: |
          set -euo pipefail
          mkdocs build -f docs/mkdocs.yml --strict

      # site_url puts the site under /fritzfluxdb/, so every internal link in the
      # generated HTML is root-relative. lychee resolves those against --root-dir,
      # and this symlink makes that directory look like the deployed site: the
      # Pages base path resolves back into site/ instead of a missing directory.
      - name: Mirror the Pages base path for link checking
        run: ln -sfn site fritzfluxdb

      # Runs against the same build that gets deployed. img.shields.io is excluded
      # because the README and landing-page badges are rendered on demand by a third
      # party that throttles: a badge answering 503 says nothing about the docs and
      # would only produce reruns. The site's own base URL is excluded because every
      # page carries it as its canonical link: checking it over the network tests the
      # currently deployed site, not this build, and fails before the first deploy.
      # Internal link integrity is covered by the strict mkdocs build above.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --root-dir ${{ github.workspace }}
            --exclude 'fonts\.gstatic\.com'
            --exclude 'img\.shields\.io'
            --exclude 'gill-bates\.github\.io/fritzfluxdb'
            './site/**/*.html'
          fail: true

      - name: Upload artifact
        if: |
          github.ref == 'refs/heads/main' &&
          (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'workflow_run'
          )
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  # The docs extra pins only direct dependencies, so the resolved transitive set is only
  # known after an install. This job installs the same declared group into a venv and
  # scans the frozen result; Trivy reports on what a manifest names, and the frozen list
  # adds the transitive packages.
  security-scan:
    name: Scan docs dependencies
    # workflow_run fires on every conclusion of the release workflow, including manual
    # test dispatches (push=false, one architecture). Only a successful tag push (v*)
    # always publishes, so only that rebuilds the docs; other triggers are unaffected.
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # No explicit ref, for the same reason as in the build job.
      # The helper lives in the repository, so the checkout has to come first. It prints
      # the agent banner and points TMPDIR, TMP and TEMP at the job temp directory.
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Trivy's pip analyzer recognizes only a file named exactly requirements.txt (measured
      # with Trivy 0.70.0, not on a differently named file). It lives in its own scan
      # directory below the job temp directory, outside the repository tree.
      - name: Freeze the resolved docs environment
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/docs-venv"
          python tools/pyproject-deps.py docs > "$RUNNER_TEMP/requirements-docs.txt"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install -r "$RUNNER_TEMP/requirements-docs.txt"
          mkdir -p "$RUNNER_TEMP/docs-scan"
          "$venv/bin/python" -m pip freeze --all > "$RUNNER_TEMP/docs-scan/requirements.txt"
          cat "$RUNNER_TEMP/docs-scan/requirements.txt"

      - name: Trivy scan docs dependencies
        id: trivy
        # Pinned to an immutable commit SHA, see GHSA-69fq-xp46-6x23.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: 'true'
          scan-type: 'fs'
          scan-ref: '${{ runner.temp }}/docs-scan'
          # Dependency vulnerabilities only; secret and misconfig scanning of the
          # sources belongs to ci.yml.
          scanners: 'vuln'
          trivyignores: .trivyignore
          format: 'json'
          output: '${{ runner.temp }}/trivy-docs.json'
          # Lists every package, so a clean scan still proves it read the frozen file.
          list-all-pkgs: true
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          timeout: '5m'

      # The scan step above carries the blocking exit code. This step proves the report
      # names the frozen file with packages: a green scan of nothing is a failure.
      - name: Summarize Trivy report
        if: ${{ !cancelled() && steps.trivy.conclusion != 'skipped' }}
        run: |
          set -euo pipefail
          python3 tools/trivy_report.py status "$RUNNER_TEMP/trivy-docs.json" \
            --expect-class lang-pkgs --expect-target requirements.txt \
            --summary-title "Trivy (docs dependencies)" --list 20 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-docs-report
          path: ${{ runner.temp }}/trivy-docs.json
          retention-days: 30
          if-no-files-found: warn

  deploy:
    if: |
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_run'
      )
    needs: [build, security-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A deploy that is cancelled midway leaves a half-written site, so it never cancels.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read  # sparse checkout of the job helper
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Only the shared job helper is needed in this job.
      - name: Checkout job helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # The helper lives in the repository, so the checkout has to come first. It prints
      # the agent banner and points TMPDIR, TMP and TEMP at the job temp directory.
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # One tracking issue per failure, not one per run. Only this job may write issues.
  report-failure:
    name: Report failed scheduled run
    needs: [build, security-scan]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read  # checkout of the tools
      issues: write
    steps:
      - name: Checkout tools and job helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            tools
      # The helper lives in the repository, so the checkout has to come first. It prints
      # the agent banner and points TMPDIR, TMP and TEMP at the job temp directory.
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/failure_issue.py --title "Docs build scan failed"
