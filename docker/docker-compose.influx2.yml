services:
  fritzfluxdb:
    image: giiibates/fritzfluxdb:latest
    container_name: fritzfluxdb_influx2
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - ../.env
    environment:
      # User settings come from ../.env only; keep ${...} interpolation out of here,
      # because Compose resolves it from docker/.env and would override env_file with empty values.
      DB_TYPE: "influxdb_v2"

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'run.py' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
