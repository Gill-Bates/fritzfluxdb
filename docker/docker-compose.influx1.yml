services:
  fritzfluxdb:
    image: giiibates/fritzfluxdb:latest
    container_name: fritzfluxdb_influx1
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - ../.env
    environment:
      TZ: ${TZ:-Europe/Berlin}
      FRITZBOX_HOSTNAME: ${FRITZBOX_HOSTNAME:-192.168.178.1}
      FRITZBOX_USERNAME: ${FRITZBOX_USERNAME}
      FRITZBOX_PASSWORD: ${FRITZBOX_PASSWORD}
      DB_TYPE: "influxdb_v1"
      INFLUXDB_HOSTNAME: ${INFLUXDB_HOSTNAME}
      INFLUXDB_PORT: ${INFLUXDB_PORT:-8086}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE:-fritzflux}
      INFLUXDB_USERNAME: ${INFLUXDB_USERNAME:-}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD:-}
      INFLUXDB_TLS_ENABLED: ${INFLUXDB_TLS_ENABLED:-false}
      # Set true only when this external endpoint uses HTTP on a trusted network.
      INFLUXDB_ALLOW_PLAINTEXT_CREDENTIALS: ${INFLUXDB_ALLOW_PLAINTEXT_CREDENTIALS:-false}

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'run.py' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
