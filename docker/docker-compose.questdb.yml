services:
  questdb:
    image: questdb/questdb:latest
    container_name: questdb
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9003:9003"
    volumes:
      - questdb_data:/var/lib/questdb
    environment:
      - QDB_TELEMETRY_ENABLED=false

  fritzfluxdb:
    image: giiibates/fritzfluxdb:latest
    container_name: fritzfluxdb_questdb
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      - questdb
    env_file:
      - ../.env
    environment:
      # User settings come from ../.env only; keep ${...} interpolation out of here,
      # because Compose resolves it from docker/.env and would override env_file with empty values.
      DB_TYPE: "questdb"
      # Bundled QuestDB service on the Compose network (HTTP, no TLS).
      QUESTDB_HOSTNAME: questdb
      QUESTDB_PORT: 9000
      QUESTDB_ALLOW_PLAINTEXT_CREDENTIALS: "true"

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'run.py' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  questdb_data:
